<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Simpsons Ultimate Quiz</title>
</head>
<body>
    <!---------------------------------- Navbar ---------------------------------->
    <header><nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
   
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
</header>
    <!---------------------------------- End Navbar ---------------------------------->
<!---------------------------------- Quiz Container ---------------------------------->
    <div class="container">
        <h1>The Simpsons Ultimate Quiz</h1>
        <section class="logo"></section>
               
        <div id="quiz-container"> 
            <!-- Modal -->
            
            <div id="question"></div>
            <div id="options">
                <button id="option0" onclick="checkAnswer(0)">1</button>
                <button id="option1" onclick="checkAnswer(1)">2</button>
                <button id="option2" onclick="checkAnswer(2)">3</button>
                <button id="option3" onclick="checkAnswer(3)">4</button>
            </div>
            <div id="scored"><span id="actualScore"></span></div>
            
            <div id="result"></div>
        </div>
        <div id="playAgain">
            <p>Did you enjoy the quiz?</p>
            <button id="playAgain0" onclick="playGameAgain(0)">Yes</button>
            <button id="playAgain1" onclick="playGameAgain(1)">No, take me to Google instead</button>
        </div>
        <button id="start-btn" onclick="quizmaster()">Start Quiz</button>
        <button id="reset-btn" onclick=>Take Quiz Again</button> 
    </div>
    <!---------------------------------- End Quiz Container ---------------------------------->
    <script src="assets/js/script.js"></script>
    <footer>
        <h2>Created by Michael J. - 2025 &copy;</h2>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
