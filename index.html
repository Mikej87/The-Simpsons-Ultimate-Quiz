<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Simpsons Ultimate Quiz</title>
</head>
<body>
    <div class="container">
        <h1>The Simpsons Ultimate Quiz</h1>
        <section class="logo"></section>
        <div id="quiz-container">   
            <div id="question"></div>
            <div id="options">
                <button id="option0" onclick="checkAnswer(0)"></button>
                <button id="option1" onclick="checkAnswer(1)"></button>
                <button id="option2" onclick="checkAnswer(2)"></button>
                <button id="option3" onclick="checkAnswer(3)"></button>
            </div>
            <div id="scored"><span id="actualScore"></span></div>
            
            <div id="result"></div>
        </div>
        
        <button id="start-btn" onclick="quizmaster()">Start Quiz</button>
        <button id="reset-btn" onclick=>Take Quiz Again</button> 
    </div>
    <script src="assets/js/script.js"></script>
    <footer>
        <p>Created by Michael J. - 2025 &copy;</p>
    </footer>
</body>
</html>
